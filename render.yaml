services:
  - type: web
    name: diabetes-ai-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PROJECT_NAME
        value: "Diabetes Prediction API"
      - key: API_VERSION
        value: "1.0.0"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
    disk:
      name: data
      mountPath: /opt/render/project/backend
      sizeGB: 1

