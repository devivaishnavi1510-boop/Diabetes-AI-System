services:
  - type: web
    name: diabetes-ai-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn --app-dir backend main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        sync: false
      - key: API_VERSION
        value: 1.0.0
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: FRONTEND_URL
        sync: false
